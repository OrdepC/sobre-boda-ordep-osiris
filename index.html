
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ordep & Osiris | Nuestra boda</title>

<style>
:root {
  --gold: #bd9b55;
  --gold-light: #ead7a4;
  --gold-dark: #86672f;
  --ivory: #fffdf8;
  --ink: #655337;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  overflow-x: hidden;
  font-family: Georgia, "Times New Roman", serif;
  color: var(--ink);
  background:
    radial-gradient(ellipse at 50% 38%, #fffefa 0%, #f8f0df 55%, #e8d8b8 100%);
}

.page {
  position: relative;
  min-height: 100vh;
  padding: 38px 18px 30px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  isolation: isolate;
}

.page::before {
  content: "";
  position: absolute;
  inset: 12px;
  border: 1px solid #bd9b5570;
  pointer-events: none;
  z-index: -1;
}

.page::after {
  content: "✧";
  position: absolute;
  top: 23px;
  left: 50%;
  transform: translateX(-50%);
  color: var(--gold);
  font-size: 23px;
}

.eyebrow {
  margin: 0 0 8px;
  color: var(--gold-dark);
  font-size: 10px;
  letter-spacing: 5px;
  text-transform: uppercase;
}

.heading {
  margin: 0;
  font-size: clamp(29px, 6vw, 43px);
  font-weight: normal;
  font-style: italic;
  color: #987b43;
}

.names {
  margin: 10px 0 27px;
  font-size: 12px;
  letter-spacing: 4px;
  color: #8e7955;
}

.ornament {
  margin: 0 0 22px;
  color: var(--gold);
  font-size: 20px;
  letter-spacing: 8px;
}

.envelope {
  position: relative;
  width: min(84vw, 370px);
  height: clamp(205px, 57vw, 250px);
  perspective: 1200px;
  filter: drop-shadow(0 17px 17px #71582c25);
  animation: arrive 1.1s ease both;
}

@keyframes arrive {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: translateY(0); }
}

.envelope-back {
  position: absolute;
  inset: 0;
  overflow: hidden;
  border: 1px solid #c5a66a;
  border-radius: 3px;
  background: linear-gradient(145deg, #f4e7c9, #d8bd83);
}

.envelope-back::after {
  content: "❦";
  position: absolute;
  right: 12px;
  bottom: 5px;
  color: #a8874c70;
  font-size: 30px;
}

.letter {
  position: absolute;
  z-index: 2;
  left: 7%;
  top: 5%;
  width: 86%;
  height: 90%;
  padding: 20px 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border: 1px solid #d8c69f;
  outline: 1px solid #eee3cb;
  outline-offset: -6px;
  background:
    radial-gradient(ellipse at center, #fffefa, #fbf4e5);
  transition: transform 1.15s cubic-bezier(.2,.8,.2,1);
}

.letter::before,
.letter::after {
  content: "❦";
  color: #b69a61;
  font-size: 17px;
  position: absolute;
}
.letter::before { top: 8px; }
.letter::after { bottom: 8px; }

.monogram {
  color: #a18347;
  font-size: clamp(32px, 9vw, 45px);
  font-style: italic;
  line-height: 1.1;
}

.letter-title {
  margin: 9px 0 5px;
  font-size: 11px;
  letter-spacing: 3px;
}

.letter-subtitle {
  margin: 0;
  font-size: 12px;
  font-style: italic;
  color: #9a8357;
}

.flap {
  position: absolute;
  z-index: 5;
  inset: 0;
  transform-origin: top center;
  transform: rotateX(0deg);
  backface-visibility: visible;
  transition: transform 850ms ease, z-index 0s 400ms;
  background: linear-gradient(155deg, #f6e9c9, #d6b778);
  clip-path: polygon(0 0, 100% 0, 50% 58%);
  filter: drop-shadow(0 1px 1px #8e7138);
}

.front-left,
.front-right,
.front-bottom {
  position: absolute;
  inset: 0;
  z-index: 4;
  pointer-events: none;
}

.front-left {
  background: linear-gradient(110deg, #e6d09f, #c9aa69);
  clip-path: polygon(0 0, 51% 51%, 0 100%);
}

.front-right {
  background: linear-gradient(250deg, #ead7a8, #c7a666);
  clip-path: polygon(100% 0, 49% 51%, 100% 100%);
}

.front-bottom {
  background: linear-gradient(0deg, #c7a363, #eddbb0);
  clip-path: polygon(0 100%, 50% 48%, 100% 100%);
}

.front-bottom::after {
  content: "❦";
  position: absolute;
  left: 50%;
  bottom: 8px;
  transform: translateX(-50%);
  color: #fff7e5b0;
  font-size: 22px;
}

.seal {
  position: absolute;
  z-index: 7;
  left: 50%;
  top: 52%;
  transform: translate(-50%, -50%);
  width: 69px;
  height: 69px;
  border: 1px solid #f0dca6;
  border-radius: 50%;
  color: #fff5d9;
  font-family: Georgia, serif;
  font-size: 19px;
  font-style: italic;
  cursor: pointer;
  background:
    radial-gradient(circle at 32% 25%, #d6b86f, #a77e37 65%, #795523);
  box-shadow:
    0 0 0 3px #c5a46470,
    0 4px 12px #60461f40,
    inset 0 0 0 2px #f5e4b655;
  transition: opacity .45s ease, transform .45s ease;
}

.seal::before {
  content: "✧";
  position: absolute;
  inset: 5px;
  border: 1px solid #f1dfb36b;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 40px;
  opacity: .45;
}

.seal span {
  position: relative;
  z-index: 1;
}

.instruction {
  margin: 27px 0 0;
  color: #8a734b;
  font-size: 11px;
  letter-spacing: 2px;
  line-height: 1.8;
  text-transform: uppercase;
}

.instruction::after {
  content: "  ✧";
  color: var(--gold);
}

.enter {
  display: inline-block;
  margin-top: 22px;
  padding: 15px 28px;
  min-width: 220px;
  color: #80632d;
  border: 1px solid var(--gold);
  outline: 1px solid #bd9b5545;
  outline-offset: 4px;
  background: #fffdf8d9;
  text-decoration: none;
  font-size: 11px;
  letter-spacing: 3px;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transform: translateY(12px);
  transition: opacity .7s ease, transform .7s ease, background .3s ease;
}

.enter:hover {
  background: #ead8ad;
}

.footer {
  margin: 30px 0 0;
  color: #9a855e;
  font-size: 9px;
  letter-spacing: 3px;
}

.sparkle {
  position: absolute;
  color: #b99750;
  pointer-events: none;
  opacity: 0;
  animation: twinkle 3s ease-in-out infinite;
}

.sparkle.one { top: 24%; left: 12%; font-size: 18px; }
.sparkle.two { top: 33%; right: 11%; font-size: 13px; animation-delay: 1s; }
.sparkle.three { bottom: 23%; left: 17%; font-size: 12px; animation-delay: 1.6s; }
.sparkle.four { bottom: 28%; right: 14%; font-size: 19px; animation-delay: .6s; }

@keyframes twinkle {
  0%, 100% { opacity: 0; transform: scale(.7) rotate(0); }
  50% { opacity: .8; transform: scale(1.15) rotate(18deg); }
}

.envelope.open .flap {
  transform: rotateX(180deg);
  z-index: 1;
}

.envelope.open .letter {
  transform: translateY(-43%);
}

.envelope.open .seal {
  opacity: 0;
  transform: translate(-50%, -50%) scale(.65);
  pointer-events: none;
}

.page.opened .enter {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transform: translateY(0);
  transition-delay: .7s;
}

.page.opened .instruction {
  color: #9b7b3d;
}

@media (max-width: 420px) {
  .page { padding-top: 34px; }
  .names { margin-bottom: 24px; }
  .envelope { width: 86vw; }
  .seal { width: 61px; height: 61px; }
  .sparkle.one { left: 5%; }
  .sparkle.two { right: 5%; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>
<main class="page" id="page">

  <span class="sparkle one">✧</span>
  <span class="sparkle two">✦</span>
  <span class="sparkle three">✧</span>
  <span class="sparkle four">✦</span>

  <p class="eyebrow">Una historia, un destino</p>
  <h1 class="heading">Nuestra boda</h1>
  <p class="names">ORDEP &amp; OSIRIS</p>
  <div class="ornament">— ❦ —</div>

  <div class="envelope" id="envelope">
    <div class="envelope-back"></div>

    <div class="letter">
      <div class="monogram">O <span style="font-size:.65em">&amp;</span> O</div>
      <p class="letter-title">ORDEP &amp; OSIRIS</p>
      <p class="letter-subtitle">Con todo nuestro amor...</p>
    </div>

    <div class="front-left"></div>
    <div class="front-right"></div>
    <div class="front-bottom"></div>
    <div class="flap"></div>

    <button class="seal" id="seal" type="button" aria-label="Abrir el sobre">
      <span>O&amp;O</span>
    </button>
  </div>

  <p class="instruction" id="instruction">
    Toca el sello para descubrir nuestra invitación
  </p>

  <a class="enter"
     id="enter"
     href="https://sites.google.com/view/nuestra-boda-ordep-y-osiris/invitaci%C3%B3n"
     target="_top"
     rel="noopener">
    ABRIR INVITACIÓN &nbsp; ♡
  </a>

  <p class="footer">NOS ENCANTARÍA CONTAR CONTIGO</p>

</main>

<script>
  const seal = document.getElementById("seal");
  const envelope = document.getElementById("envelope");
  const page = document.getElementById("page");
  const instruction = document.getElementById("instruction");

  seal.addEventListener("click", function () {
    envelope.classList.add("open");
    page.classList.add("opened");
    instruction.textContent = "Con mucha ilusión, te esperamos";
  });
</script>
</body>
</html>
